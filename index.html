<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Stock Scanner Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #0284c7; color: white; border-color: #38bdf8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        tr:hover { background: #334155; cursor: pointer; }
        .positive { color: #4ade80; font-weight: bold; }
        .negative { color: #f87171; font-weight: bold; }
        .btn-action { background: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 24px; border-radius: 12px; width: 90%; max-width: 600px; border: 1px solid #475569; position: relative; }
        .close-btn { position: absolute; top: 12px; right: 16px; color: #94a3b8; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🚀 USA Stock Scanner Dashboard</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all')">All Stocks</button>
        <button class="tab-btn" onclick="switchTab('gainers')">Top Gainers</button>
        <button class="tab-btn" onclick="switchTab('losers')">Top Losers</button>
    </div>

    <div id="tab-all" class="tab-content active">
        <table>
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Name</th>
                    <th>Price ($)</th>
                    <th>Change (%)</th>
                    <th>P/E Ratio</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="stock-table-body">
            </tbody>
        </table>
    </div>

    <!-- Details Modal -->
    <div id="stockModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Stock Details</h2>
            <canvas id="modalChart" height="200"></canvas>
            <div style="margin-top: 15px;">
                <button class="btn-action" onclick="openTriggerModal()">Set Trigger / Alert</button>
            </div>
        </div>
    </div>

    <!-- Trigger Modal -->
    <div id="triggerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeTriggerModal()">&times;</span>
            <h2>Set Price Trigger</h2>
            <p>Set automated notification threshold for target price.</p>
            <input type="number" id="triggerPrice" placeholder="Enter target price ($)" style="width: 100%; padding: 8px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
            <button class="btn-action" onclick="alert('Trigger saved successfully!'); closeTriggerModal();">Save Trigger</button>
        </div>
    </div>

    <script>
        const stockData = [{"ticker": "AAPL", "name": "Apple Inc.", "price": 305.93, "change": 0.22, "volume": 28186700, "marketCap": 4464797286400, "peRatio": 35.04, "history": [327.22, 332.97, 333.45, 326.31, 327.46, 325.61, 321.38, 332.73, 336.62, 339.79, 337.9, 333.14, 308.64, 303.16, 309.11, 310.73, 312.14, 313.06, 308.26, 304.91, 302.25, 305.26, 305.93]}, {"ticker": "MSFT", "name": "Microsoft Corporation", "price": 495.4, "change": -0.3, "volume": 16205200, "marketCap": 3678615371776, "peRatio": 27.71, "history": [395.63, 401.1, 393.82, 402.29, 397.75, 390.34, 381.58, 381.7, 389.1, 393.35, 390.54, 451.1, 464.72, 487.65, 492.81, 487.46, 499.86, 499.99, 506.06, 503.81, 492.43, 496.88, 495.4]}, {"ticker": "GOOGL", "name": "Alphabet Inc.", "price": 345.9, "change": -0.13, "volume": 17753300, "marketCap": 4230334382080, "peRatio": 17.39, "history": [370.92, 354.46, 346.77, 351.99, 347.15, 342.09, 317.69, 319.74, 326.56, 333.71, 336.71, 333.66, 356.13, 373.51, 377.65, 362.43, 357.75, 354.3, 357.52, 343.8, 343.54, 346.36, 345.9]}, {"ticker": "AMZN", "name": "Amazon.com, Inc.", "price": 262.65, "change": -0.94, "volume": 27184900, "marketCap": 2833025073152, "peRatio": 21.32, "history": [254.96, 249.89, 247.23, 249.99, 247.55, 244.85, 233.66, 232.11, 231.39, 230.86, 226.65, 235.5, 271.58, 284.02, 277.42, 272.65, 272.26, 274.48, 278.09, 272.27, 267.28, 265.13, 262.65]}, {"ticker": "NVDA", "name": "NVIDIA Corporation", "price": 225.16, "change": -0.06, "volume": 75504000, "marketCap": 5453600260096, "peRatio": 34.48, "history": [212.5, 207.4, 202.81, 203.28, 207.29, 212.06, 208.76, 206.84, 196.51, 197.01, 190.01, 195.04, 200.75, 206.64, 211.94, 219.22, 218.99, 223.96, 217.55, 217.5, 224.09, 225.3, 225.16]}, {"ticker": "TSLA", "name": "Tesla, Inc.", "price": 342.27, "change": 0.68, "volume": 45375100, "marketCap": 1351811596288, "peRatio": 311.15, "history": [394.46, 391.06, 380.84, 369.57, 378.93, 374.01, 319.69, 313.03, 309.22, 307.44, 298.32, 308.85, 311.21, 322.08, 327.35, 321.55, 319.53, 328.58, 330.88, 332.81, 327.51, 339.96, 342.27]}, {"ticker": "META", "name": "Meta Platforms, Inc.", "price": 589.85, "change": -0.86, "volume": 8731600, "marketCap": 1502646501376, "peRatio": 22.42, "history": [681.31, 664.54, 646.01, 645.85, 643.81, 627.17, 606.1, 595.19, 593.87, 593.41, 585.61, 539.03, 556.71, 590.24, 587.94, 588.77, 589.9, 592.1, 594.92, 599.12, 578.85, 594.97, 589.85]}];
        let modalChartInstance = null;

        function renderTable(data) {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = '';
            data.forEach(item => {
                const changeClass = item.change >= 0 ? 'positive' : 'negative';
                const sign = item.change >= 0 ? '+' : '';
                tbody.innerHTML += `
                    <tr onclick="openModal('${item.ticker}')">
                        <td><strong>${item.ticker}</strong></td>
                        <td>${item.name}</td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td class="${changeClass}">${sign}${item.change.toFixed(2)}%</td>
                        <td>${item.peRatio || 'N/A'}</td>
                        <td><button class="btn-action" onclick="event.stopPropagation(); openTriggerModal('${item.ticker}')">Set Alert</button></td>
                    </tr>
                `;
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (event) event.target.classList.add('active');
            
            let filtered = [...stockData];
            if (tabName === 'gainers') {
                filtered = stockData.filter(s => s.change > 0).sort((a,b) => b.change - a.change);
            } else if (tabName === 'losers') {
                filtered = stockData.filter(s => s.change < 0).sort((a,b) => a.change - b.change);
            }
            renderTable(filtered);
        }

        function openModal(ticker) {
            const item = stockData.find(s => s.ticker === ticker);
            if (!item) return;

            document.getElementById('modalTitle').innerText = `${item.name} (${item.ticker}) - $${item.price}`;
            document.getElementById('stockModal').style.display = 'flex';

            const ctx = document.getElementById('modalChart').getContext('2d');
            if (modalChartInstance) modalChartInstance.destroy();

            modalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: item.history.map((_, i) => `Day ${i + 1}`),
                    datasets: [{
                        label: 'Price History (30 Days)',
                        data: item.history,
                        borderColor: item.change >= 0 ? '#4ade80' : '#f87171',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#f8fafc' } } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' } },
                        y: { ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('stockModal').style.display = 'none';
        }

        function openTriggerModal(ticker) {
            document.getElementById('triggerModal').style.display = 'flex';
        }

        function closeTriggerModal() {
            document.getElementById('triggerModal').style.display = 'none';
        }

        // Initial setup
        renderTable(stockData);
    </script>
</body>
</html>
