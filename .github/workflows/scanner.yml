name: Run Stock Scanner

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *' # Runs daily automatically
  workflow_dispatch: # Enables manual "Run workflow" button

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants GitHub permission to update your repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install All Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests beautifulsoup4 lxml ta plotly scipy

      - name: Run Market Scanner Script
        run: python scanner.py

      - name: Commit & Push index.html Automatically
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update index.html [skip ci]"
          file_pattern: "index.html"
