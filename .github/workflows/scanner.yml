name: Run Stock Scanner

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install All Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests beautifulsoup4 lxml ta plotly scipy

      - name: Run Market Scanner Script
        run: python scanner.py

      - name: Commit & Push index.html
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update index.html"
          file_pattern: "index.html"
          push_options: '--force'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
