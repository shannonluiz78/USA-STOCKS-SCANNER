name: Run Stock Scanner

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *' # Runs automatically once every day
  workflow_dispatch: # Enables the manual "Run workflow" button

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # Forces GitHub to grant full read and write permissions to this run
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4 lxml

      - name: Run Market Scanner Script
        run: python scanner.py

      - name: Commit and Push Updated index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update index.html [skip ci]" || echo "No changes to commit"
          git push
